[project]
name = "text2sql-eval"
version = "0.1.0"
description = "Execution-accuracy evaluation of Mistral models on BIRD mini-dev text-to-SQL"
readme = "README.md"
authors = [
    { name = "Masoud Rezvaninejad", email = "s.masoudrezvani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mistralai==3.7.0",
    "python-dotenv>=1.0",
    "sqlglot>=30.30.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
